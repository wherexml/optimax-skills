name: skills-manager

on:
  push:
    paths:
      - "skills-manager/**"
      - ".github/workflows/skills-manager.yml"
  pull_request:
    paths:
      - "skills-manager/**"
      - ".github/workflows/skills-manager.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/quick_validate.py .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_publication.py . --json
