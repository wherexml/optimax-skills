name: plugins

on:
  push:
    paths:
      - ".agents/plugins/**"
      - "plugins/**"
      - "optimax-ppt-imagegen/**"
      - "skills-manager/**"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - ".agents/plugins/**"
      - "plugins/**"
      - "optimax-ppt-imagegen/**"
      - "skills-manager/**"
      - ".github/workflows/plugins.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace paths and plugin manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          market = json.loads((root / ".agents/plugins/marketplace.json").read_text())
          assert market["name"] == "optimax-skills"
          assert len(market["plugins"]) == 2
          for entry in market["plugins"]:
              assert entry["policy"]["installation"] == "AVAILABLE"
              assert entry["policy"]["authentication"] == "ON_INSTALL"
              plugin = root / entry["source"]["path"]
              manifest = json.loads((plugin / ".codex-plugin/plugin.json").read_text())
              assert manifest["name"] == entry["name"] == plugin.name
              assert (plugin / "skills" / entry["name"] / "SKILL.md").is_file()
          PY
      - name: Verify plugin Skill mirrors
        run: |
          diff -qr optimax-ppt-imagegen plugins/optimax-ppt-imagegen/skills/optimax-ppt-imagegen
          diff -qr skills-manager plugins/skills-manager/skills/skills-manager
